<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Парикмахерская "Стиль"</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        #chat { border: 1px solid #ddd; border-radius: 8px; height: 400px; overflow-y: auto; padding: 12px; margin-bottom: 12px; background: #fafafa; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
        .user { background: #007bff; color: white; margin-left: auto; }
        .bot { background: #e9ecef; color: #333; }
        #input-row { display: flex; gap: 8px; }
        #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>💈 Администратор салона "Стиль"</h2>
    <div id="chat"></div>
    <div id="input-row">
        <input id="input" placeholder="Напишите сообщение..." />
        <button onclick="send()">Отправить</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            addMsg(text, 'user');
            input.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                addMsg(data.answer, 'bot');
            } catch (e) {
                addMsg('Ошибка соединения. Попробуйте ещё раз.', 'bot');
            }
        }

        input.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
    </script>
</body>
</html>
